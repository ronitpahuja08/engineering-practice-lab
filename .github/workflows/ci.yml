name: Verify Practice Lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d9c5f1541a6e6d1ef9b65c66cf2
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
